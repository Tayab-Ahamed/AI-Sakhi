name: AI Sakhi CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff pip-audit

      - name: Backend lint and formatting
        run: |
          ruff check backend
          ruff format --check backend

      - name: Python dependency advisory scan
        run: pip-audit -r requirements.txt

      - name: Run tests
        env:
          GROQ_API_KEY: "mock-key-for-testing"
          SAKHI_JWT_SECRET: "ci-secret-for-testing"
        run: pytest

      - name: Deterministic grader regression gate (not live-model evaluation)
        run: python evals/run_evals.py

  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Frontend dependency advisory scan
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          BACKEND_URL: "http://localhost:8000"
        run: npm run build
