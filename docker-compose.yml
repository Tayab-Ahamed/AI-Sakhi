services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - sakhi_data:/app/data
      - sakhi_chroma:/app/chroma_db
      - sakhi_backups:/app/backups
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      SAKHI_JWT_SECRET: ${SAKHI_JWT_SECRET:?SAKHI_JWT_SECRET is required}
      SAKHI_ENV: production
      SAKHI_ENABLE_DEMO_SEED: "false"
      SAKHI_AI_APPROVAL_MODE: ${SAKHI_AI_APPROVAL_MODE:-unconfigured}
      SAKHI_PRIVACY_POLICY_VERSION: ${SAKHI_PRIVACY_POLICY_VERSION:-}
      SAKHI_CHAT_RETENTION_DAYS: ${SAKHI_CHAT_RETENTION_DAYS:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      DB_PATH: /app/data/sakhi.db
      CHROMA_PATH: /app/chroma_db
      RAG_MAX_DISTANCE: ${RAG_MAX_DISTANCE:-0.72}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    environment:
      BACKEND_URL: http://backend:8000
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  sakhi_data:
  sakhi_chroma:
  sakhi_backups:
