<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline — AI Sakhi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #010102;
      color: #f7f8f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      background: #0c0c0d;
      border: 1px solid #23252a;
      border-radius: 24px;
      padding: 6px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
    }
    .core {
      background: #0f1011;
      border: 1px solid #1a1b1d;
      border-radius: 19px;
      padding: 44px 36px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrap {
      width: 56px;
      height: 56px;
      background: rgba(94, 106, 210, 0.12);
      border: 1px solid rgba(94, 106, 210, 0.25);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon-wrap svg {
      width: 28px;
      height: 28px;
      stroke: #5e6ad2;
      stroke-width: 1.75;
      fill: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #23252a;
      border-radius: 9999px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8a8f98;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e11d48;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: #f7f8f8;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #8a8f98;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 360px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      background: #5e6ad2;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s cubic-bezier(0.32, 0.72, 0, 1), transform 0.15s ease;
    }
    .btn:hover {
      background: #828fff;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .tip {
      margin-top: 28px;
      padding: 14px 18px;
      background: rgba(94, 106, 210, 0.06);
      border: 1px solid rgba(94, 106, 210, 0.15);
      border-radius: 12px;
      font-size: 13px;
      color: #d0d6e0;
      text-align: left;
      width: 100%;
      line-height: 1.5;
    }
    .tip-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #828fff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="core">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <div class="badge">
        <span class="badge-dot"></span> Offline Mode
      </div>

      <h1>You're offline right now</h1>
      <p>
        No internet connection detected. Sakhi will automatically reconnect as soon as you're back online.
      </p>

      <button class="btn" onclick="window.location.reload()">
        Try Reconnecting
      </button>

      <div class="tip">
        <div class="tip-title">⚡ Offline Access</div>
        While offline, you can continue reviewing flashcards, saved summaries, and practice questions.
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
